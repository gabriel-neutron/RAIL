[package]
name = "rail"
version = "0.1.0"
description = "RAIL — Radio Analysis and Intel Lab (Tauri v2 desktop app)"
authors = ["RAIL"]
edition = "2021"

[lib]
name = "rail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
profile = []

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1"
rustfft = "6"
nusb = "0.1"
bytemuck = "1"
num-complex = "0.4"
tauri-plugin-dialog = "2"

# Lints enforced by CI (`cargo clippy -- -D warnings`). These mechanise the
# rules stated in CLAUDE.md so they fail the build instead of relying on review.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
# CLAUDE.md requires doc comments on all public functions. 171 items are
# currently undocumented, so this stays off until that backlog is cleared —
# turning it on now would just be `-D warnings` noise. TODO: raise to "warn".
missing_docs = "allow"

[lints.clippy]
# CLAUDE.md: "No unwrap() in Rust except in tests". Test modules opt out with
# an inner #![allow(...)].
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# FFI safety: every unsafe block must state why it is sound.
undocumented_unsafe_blocks = "deny"
# Precision/truncation in DSP code: ~100 sites, nearly all deliberate index
# and sample-rate arithmetic. Left off rather than sprinkling #[allow] over
# every cast; revisit if a real precision bug ever ships.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# General hygiene.
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
