name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same branch are cancelled instead of queueing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # Fast gate: fails in ~1 min on generated-file drift, before any compilation.
  codegen:
    name: Codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate IPC event names
        run: node scripts/gen-ipc-event-names.mjs

      - name: Fail if the committed output is stale
        run: |
          if ! git diff --exit-code -- src/ipc/generated; then
            echo "::error::src/ipc/generated is out of date with shared/ipc_event_names.json."
            echo "::error::Run 'npm run gen:ipc-events' and commit the result."
            exit 1
          fi

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librtlsdr-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            build-essential pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install librtlsdr
          echo "LIBRTLSDR_LIB_DIR=$(brew --prefix librtlsdr)/lib" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> $GITHUB_ENV

      # Mirrors release.yml so a linker break surfaces on PR, not at tag time.
      - name: Fetch librtlsdr Windows prebuilts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/rtlsdrblog/rtl-sdr-blog/releases/download/v1.3.6/Release.zip"
          Invoke-WebRequest -Uri $url -OutFile "librtlsdr.zip"
          Expand-Archive -Path "librtlsdr.zip" -DestinationPath "librtlsdr-win"
          New-Item -ItemType Directory -Force -Path vendor/librtlsdr-win-x64 | Out-Null
          foreach ($file in @("rtlsdr.dll", "rtlsdr.lib", "pthreadVC2.dll", "msvcr100.dll")) {
            $src = "librtlsdr-win\x64\$file"
            if (Test-Path $src) { Copy-Item $src -Destination vendor/librtlsdr-win-x64/ -Force }
          }
          if (-not (Test-Path "vendor/librtlsdr-win-x64/rtlsdr.lib")) {
            Write-Error "rtlsdr.lib not found in prebuilts — linker will fail"; exit 1
          }
          echo "LIBRTLSDR_LIB_DIR=$env:GITHUB_WORKSPACE\vendor\librtlsdr-win-x64" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: cargo fmt --check
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # --all-features covers the `profile` feature, which is otherwise never
      # compiled. Lint levels live in src-tauri/Cargo.toml [lints].
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets --all-features --locked --no-fail-fast

      # --all-targets above disables doctests; run them explicitly.
      - name: cargo test --doc
        working-directory: src-tauri
        run: cargo test --doc --all-features --locked

  audit:
    name: Rust advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary: avoids a ~3 min uncached `cargo install` every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit --deny yanked

  frontend:
    name: Frontend (lint + tsc + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
